<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>빼꼼</title>
<style>
  body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; background: #e6ebef; color: #1f2a37; }
  .bar { -webkit-app-region: drag; display: flex; align-items: center; height: 30px; padding-left: 10px;
         background: #d9e0e6; font-size: 12px; font-weight: 700; color: #5b6878; }
  .bar span { flex: 1; }
  .bar button { -webkit-app-region: no-drag; border: none; background: none; width: 34px; height: 30px; font-size: 14px; cursor: pointer; }
  .bar button:hover { background: rgba(0,0,0,.08); }
  main { text-align: center; padding: 30px 16px; }
  .retry { border: none; background: #1f2a37; color: #fff; font-size: 16px; font-weight: 700; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
  <div class="bar"><span>빼꼼</span><button onclick="desktopApp.minimize()">─</button><button onclick="desktopApp.close()">✕</button></div>
  <main>
    <p>인터넷에 연결되지 않았어요.<br>연결을 확인하고 다시 눌러 주세요.</p>
    <button class="retry" onclick="desktopApp.retry()">다시 연결하기</button>
  </main>
</body>
</html>
